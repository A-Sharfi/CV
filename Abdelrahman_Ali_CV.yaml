          - Delivered business intelligence and process optimisation projects.
          - Managed agricultural projects end-to-end, from land preparation to
            harvesting and distribution.
          - Delivered a security system project under a tight budget and deadline.
          - "Technologies: Project management, business analysis, Excel, MS Project,
            dashboard development, data analysis."
      - company: DAL Group
        position: Graduate Development Program
        location: Sudan
        start_date: 2018-02
        end_date: 2020-01
        highlights:
          - Two-year rotational program across Supply Chain, HR, Sales & Marketing,
