  sections:
    profile_summary:
      - A developer with over three years of experience building financial
        applications, including ETL pipelines, dashboards, and market data
        integrations. He is now moving towards AI platform and backend
        engineering, building on an M.Sc. in Economics and Data Analysis
        (Machine Learning incl. LLMs, NLP, Big Data Management with PostgreSQL)
        and a thesis applying ML to EU inflation forecasting. With a B.Eng. in
        Electrical Engineering as well, he combines full-stack development
        experience with a proven ability to pick up new tools quickly.
      - "**Residence status:** European Blue Card (carte bleue européenne)"
    experience:
      - company: European Stability Mechanism (ESM)
        position: Financial Applications Developer
        location: Luxembourg
        start_date: 2024-05
        end_date: present
        highlights:
          - Develop and deploy applications that address technical, business, and
            security requirements.
          - Develop unit tests and facilitate User Acceptance Testing (UAT).
          - Refactor legacy code and integrate it with newly developed
            applications.
          - Build ETL processes for the scheduled update of market data.
          - Write technical documentation and publish it in SharePoint and
            Microsoft Azure.
          - Use financial data APIs (Bloomberg, Refinitiv) to retrieve and process
            market data.
          - "Technologies: Python Dash, Pandas, SQLAlchemy, MS SQL Server, Jenkins,
            Git, Selenium, unittest, SonarQube, Pylint, Bloomberg API, Refinitiv
            API, SharePoint."
      - company: European Stability Mechanism (ESM)
        position: IT Officer
        location: Luxembourg
        start_date: 2023-05
        end_date: 2024-05
        highlights:
          - Six-month traineeship during the final semester of my master's degree,
            later extended to one year.
          - Led a transformation project migrating market data and dashboards from
            Tableau to Power BI.
          - Translated client needs into technical solutions across teams.
          - Developed Power Platform solutions for business process automation.
          - "Technologies: Power BI, Power Platform, Power Automate, Git,
            SharePoint, change management, quantitative data analysis."
